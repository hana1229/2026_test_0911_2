<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JS 스튜디오 프로젝트</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f7f4;
      --text: #171717;
      --muted: #6d6d68;
      --line: rgba(20, 20, 20, 0.10);
      --paper: #ffffff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Pretendard,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        Arial,
        sans-serif;
      line-height: 1.55;
      word-break: keep-all;
    }

    .page {
      width: min(1440px, calc(100% - 40px));
      margin: 0 auto;
      padding: 52px 0 80px;
    }

    .top {
      margin-bottom: 32px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(2.5rem, 5.5vw, 5.5rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 800;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      flex: 1 1 520px;
      max-width: 760px;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.05rem;
      opacity: 0.58;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 54px;
      padding: 0 18px 0 48px;
      border: 1px solid #d8d8d2;
      border-radius: 16px;
      outline: none;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      box-shadow: 0 7px 24px rgba(0,0,0,0.035);
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    #searchInput:focus {
      border-color: #8f8f89;
      box-shadow: 0 0 0 4px rgba(0,0,0,.045);
    }

    .result-count {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: .92rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .member-card {
      min-width: 0;
      border: 1px solid rgba(0,0,0,.07);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.045);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .member-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.07);
    }

    .member-card.hidden {
      display: none;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .member-name {
      margin: 0;
      font-size: 1.55rem;
      line-height: 1.15;
      letter-spacing: -0.035em;
      font-weight: 800;
    }

    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(0,0,0,.09);
      flex: 0 0 auto;
      margin-top: 4px;
    }

    .info-list {
      display: grid;
      gap: 13px;
    }

    .info {
      display: grid;
      grid-template-columns: 102px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .label {
      color: rgba(20,20,20,.60);
      font-size: .82rem;
      font-weight: 700;
      padding-top: 2px;
    }

    .value {
      min-width: 0;
      font-size: .95rem;
      overflow-wrap: anywhere;
    }

    .value.empty {
      color: rgba(20,20,20,.38);
    }

    .inline-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .round-btn {
      display: inline-grid;
      place-items: center;
      width: 31px;
      height: 31px;
      flex: 0 0 31px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,.10);
      background: rgba(255,255,255,.62);
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, background .15s ease;
    }

    .round-btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.92);
    }

    .round-btn.disabled {
      pointer-events: none;
      opacity: .3;
    }

    .insta-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 31px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.10);
      background: rgba(255,255,255,.62);
      color: inherit;
      text-decoration: none;
      font-size: .86rem;
      font-weight: 700;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .empty-state {
      display: none;
      margin: 42px 0 0;
      padding: 36px;
      border: 1px dashed #c9c9c2;
      border-radius: 18px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,.48);
    }

    .empty-state.show {
      display: block;
    }

    .map-section {
      margin-top: 66px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 16px;
    }

    .section-title h2 {
      margin: 0;
      font-size: clamp(1.8rem, 3.2vw, 3.1rem);
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .section-title p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
      text-align: right;
    }

    #map {
      width: 100%;
      height: min(68vh, 610px);
      min-height: 430px;
      border: 1px solid #d9d9d2;
      border-radius: 22px;
      overflow: hidden;
      background: #e8e8e4;
      box-shadow: 0 14px 40px rgba(0,0,0,.045);
    }

    .map-note {
      margin: 10px 4px 0;
      color: var(--muted);
      font-size: .8rem;
    }

    .leaflet-popup-content {
      font-family:
        Pretendard,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        Arial,
        sans-serif;
      line-height: 1.5;
    }

    @media (max-width: 1100px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .page {
        width: min(100% - 24px, 640px);
        padding-top: 34px;
      }

      h1 {
        margin-bottom: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .member-card {
        padding: 21px;
      }

      .section-title {
        display: block;
      }

      .section-title p {
        margin-top: 8px;
        text-align: left;
      }

      #map {
        min-height: 390px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="top">
      <h1>JS 스튜디오 프로젝트</h1>

      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="searchInput"
            type="search"
            placeholder="이름, 음식, 사는 곳, 작품, 가수, SNS 검색"
            autocomplete="off"
            aria-label="멤버 정보 검색"
          />
        </div>
        <div class="result-count" id="resultCount"></div>
      </div>
    </section>

    <section class="cards" id="memberCards" aria-label="JS 스튜디오 프로젝트 멤버 카드"></section>
    <div class="empty-state" id="emptyState">검색 결과가 없습니다.</div>

    <section class="map-section">
      <div class="section-title">
        <h2>우리들은 어디에 살고 있을까?</h2>
        <p>기숙사 거주자는 서울과학기술대학교로 표시합니다.</p>
      </div>
      <div id="map" aria-label="수강생 거주 지역 지도"></div>
      <p class="map-note">
        ※ 지도 위치는 개인의 상세 주소가 아니라 입력된 동·지역명 기준의 대략적인 중심점입니다.
      </p>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const members = [{"name": "이병학", "food": "텐동", "foodEmoji": "🍤", "residence": "평촌", "work": "슈퍼뒤에서 담배피우는 두사람", "artist": "스피츠", "sns": "lee____bh", "color": "#E8DDD3"}, {"name": "김민지", "food": "마라탕", "foodEmoji": "🌶️🍲", "residence": "서울과학기술대학교 (기숙사)", "work": "오디세이", "artist": "스파이에어", "sns": "ljrxmo", "color": "#E4E8D8"}, {"name": "김수정", "food": "엄마밥", "foodEmoji": "🍚🏠", "residence": "하계동", "work": "스파이더맨", "artist": "마이 케미컬 로맨스", "sns": "tnwjd1229", "color": "#DCEEFF"}, {"name": "김예진", "food": "쌈밥", "foodEmoji": "🥬🍚", "residence": "수원", "work": "오디세이", "artist": "지소쿠리클럽", "sns": "yezzzzzzzzzzzin", "color": "#F1E1DB"}, {"name": "김주은", "food": "연어초밥", "foodEmoji": "🍣", "residence": "연신내", "work": "옵세션", "artist": "실리카겔", "sns": "pinking.making", "color": "#DCE8E1"}, {"name": "김채호", "food": "계란찜", "foodEmoji": "🥚", "residence": "하계", "work": "오디세이", "artist": "킹누", "sns": "k_chaeho", "color": "#E5E0F1"}, {"name": "남미경", "food": "샌드위치", "foodEmoji": "🥪", "residence": "명일동", "work": "슬로우 호시스", "artist": "alice merton", "sns": "youanialways", "color": "#ECE2D6"}, {"name": "박소영", "food": "치킨", "foodEmoji": "🍗", "residence": "서울과학기술대학교 (기숙사)", "work": "피아니스트", "artist": "빅뱅", "sns": "parksozero", "color": "#F0DFE3"}, {"name": "원유미", "food": "샤브샤브", "foodEmoji": "🍲", "residence": "방배동", "work": "Spiderman", "artist": "Alvaro Soler", "sns": "nv.quynhu", "color": "#E7E0E8"}, {"name": "임영현", "food": "미입력", "foodEmoji": "➖", "residence": "미입력", "work": "미입력", "artist": "미입력", "sns": "", "color": "#EAEAEA"}, {"name": "임훈정", "food": "삼겹살", "foodEmoji": "🥓", "residence": "중계동", "work": "오디세이", "artist": "jayb", "sns": "by_seohua", "color": "#DDE8EC"}, {"name": "채영미", "food": "통닭", "foodEmoji": "🍗", "residence": "동두천", "work": "들쥐", "artist": "드렁큰타이거", "sns": "artbadwoman", "color": "#E9E6D7"}, {"name": "최동욱", "food": "초밥", "foodEmoji": "🍣", "residence": "하계", "work": "오디세이", "artist": "한로로", "sns": "ch_dongwook", "color": "#E2EBE7"}, {"name": "카밀라", "food": "치즈 가리비", "foodEmoji": "🧀🐚", "residence": "석계", "work": "들쥐", "artist": "한로로", "sns": "camisald", "color": "#E4DCDD"}, {"name": "한다빈", "food": "뇨끼", "foodEmoji": "🥔🍝", "residence": "공릉", "work": "릴로와 스티치", "artist": "Laufey", "sns": "dabinciii", "color": "#E0E8D8"}, {"name": "호프슈타트 파울", "food": "피자", "foodEmoji": "🍕", "residence": "공릉", "work": "라스트 에어 벤더", "artist": "잔나비", "sns": "dtc_ph", "color": "#E6E1D5"}, {"name": "홍정욱", "food": "햄버거", "foodEmoji": "🍔", "residence": "전농동", "work": "파라노만", "artist": "백예린", "sns": "hongstl_studio", "color": "#DCE3ED"}, {"name": "이서진", "food": "연어덮밥", "foodEmoji": "🍣🍚", "residence": "하계", "work": "치이카와", "artist": "나토리", "sns": "2_seo__jin", "color": "#F3E7D4"}];
    const locations = [{"label": "평촌", "lat": 37.3943, "lng": 126.9568, "members": ["이병학"]}, {"label": "서울과학기술대학교 (기숙사)", "lat": 37.6317, "lng": 127.0775, "members": ["김민지", "박소영"]}, {"label": "하계·하계동", "lat": 37.636, "lng": 127.069, "members": ["김수정", "김채호", "최동욱", "이서진"]}, {"label": "수원", "lat": 37.2636, "lng": 127.0286, "members": ["김예진"]}, {"label": "연신내", "lat": 37.619, "lng": 126.921, "members": ["김주은"]}, {"label": "명일동", "lat": 37.551, "lng": 127.144, "members": ["남미경"]}, {"label": "방배동", "lat": 37.481, "lng": 126.997, "members": ["원유미"]}, {"label": "중계동", "lat": 37.65, "lng": 127.077, "members": ["임훈정"]}, {"label": "동두천", "lat": 37.9034, "lng": 127.0605, "members": ["채영미"]}, {"label": "석계", "lat": 37.6148, "lng": 127.0656, "members": ["카밀라"]}, {"label": "공릉", "lat": 37.6258, "lng": 127.0739, "members": ["한다빈", "호프슈타트 파울"]}, {"label": "전농동", "lat": 37.5797, "lng": 127.0547, "members": ["홍정욱"]}];

    const memberCards = document.getElementById("memberCards");
    const searchInput = document.getElementById("searchInput");
    const resultCount = document.getElementById("resultCount");
    const emptyState = document.getElementById("emptyState");

    function makeSearchUrl(query) {
      return "https://www.google.com/search?q=" + encodeURIComponent(query);
    }

    function makeYoutubeUrl(query) {
      return "https://www.youtube.com/results?search_query=" + encodeURIComponent(query);
    }

    function makeInstagramUrl(handle) {
      return "https://www.instagram.com/" + encodeURIComponent(handle) + "/";
    }

    function renderCards() {
      memberCards.innerHTML = "";

      members.forEach((member) => {
        const hasWork = member.work !== "미입력";
        const hasArtist = member.artist !== "미입력";
        const hasSns = Boolean(member.sns);

        const card = document.createElement("article");
        card.className = "member-card";
        card.style.background = member.color;

        card.dataset.search = [
          member.name,
          member.food,
          member.residence,
          member.work,
          member.artist,
          member.sns
        ].join(" ").toLowerCase();

        card.innerHTML = `
          <div class="card-head">
            <h3 class="member-name">${member.name}</h3>
            <span class="color-dot" title="개인 컬러"></span>
          </div>

          <div class="info-list">
            <div class="info">
              <div class="label">좋아하는 음식</div>
              <div class="value ${member.food === "미입력" ? "empty" : ""}">
                ${member.foodEmoji} ${member.food}
              </div>
            </div>

            <div class="info">
              <div class="label">사는 곳</div>
              <div class="value ${member.residence === "미입력" ? "empty" : ""}">
                ${member.residence}
              </div>
            </div>

            <div class="info">
              <div class="label">최근에 본 작품</div>
              <div class="value inline-action ${hasWork ? "" : "empty"}">
                <span>${member.work}</span>
                <a
                  class="round-btn ${hasWork ? "" : "disabled"}"
                  href="${hasWork ? makeSearchUrl(member.work) : "#"}"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="${member.work} 검색"
                  title="Google에서 작품 검색"
                >🎬</a>
              </div>
            </div>

            <div class="info">
              <div class="label">좋아하는 가수</div>
              <div class="value inline-action ${hasArtist ? "" : "empty"}">
                <span>${member.artist}</span>
                <a
                  class="round-btn ${hasArtist ? "" : "disabled"}"
                  href="${hasArtist ? makeYoutubeUrl(member.artist) : "#"}"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="${member.artist} 유튜브 검색"
                  title="YouTube에서 가수 검색"
                >💿</a>
              </div>
            </div>

            <div class="info">
              <div class="label">SNS</div>
              <div class="value">
                ${hasSns
                  ? `<a class="insta-btn" href="${makeInstagramUrl(member.sns)}" target="_blank" rel="noopener noreferrer">◎ @${member.sns}</a>`
                  : `<span class="empty">미입력</span>`
                }
              </div>
            </div>
          </div>
        `;

        memberCards.appendChild(card);
      });

      updateResultCount(members.length);
    }

    function updateResultCount(count) {
      resultCount.textContent = `${count}명`;
    }

    function filterCards() {
      const keyword = searchInput.value.trim().toLowerCase();
      const cards = [...document.querySelectorAll(".member-card")];
      let visible = 0;

      cards.forEach((card) => {
        const match = !keyword || card.dataset.search.includes(keyword);
        card.classList.toggle("hidden", !match);
        if (match) visible += 1;
      });

      updateResultCount(visible);
      emptyState.classList.toggle("show", visible === 0);
    }

    searchInput.addEventListener("input", filterCards);

    renderCards();

    const map = L.map("map", {
      scrollWheelZoom: false
    }).setView([37.58, 127.02], 10);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const bounds = [];

    locations.forEach((place) => {
      const marker = L.marker([place.lat, place.lng]).addTo(map);
      marker.bindPopup(`
        <strong>${place.label}</strong><br>
        ${place.members.join(", ")}
      `);
      bounds.push([place.lat, place.lng]);
    });

    if (bounds.length) {
      map.fitBounds(bounds, {
        padding: [36, 36],
        maxZoom: 11
      });
    }
  </script>
</body>
</html>
